# ============================================================
# Argus Core — Mac Development docker-compose
# ============================================================
# Runs ONLY the stateful services (MongoDB, Redis, MinIO,
# Prometheus, Grafana). The FastAPI backend and Celery worker
# must run NATIVELY on the Mac (not in Docker) so they can
# access the Apple Silicon MPS / Neural Engine via PyTorch.
#
# Docker Desktop on Mac runs inside a Linux VM that has NO
# access to MPS — so anything you run inside containers is
# CPU-only. To use your M1 Max GPU, the Python process must
# run directly on macOS.
#
# Usage:
#   docker compose -f docker-compose.mac-dev.yml up -d
#   docker compose -f docker-compose.mac-dev.yml down
#   docker compose -f docker-compose.mac-dev.yml logs -f
# ============================================================

services:
  # ============== DATABASE ==============
  mongodb:
    image: mongo:7
    container_name: argus-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: argusadmin
      MONGO_INITDB_ROOT_PASSWORD: arguspass123
      MONGO_INITDB_DATABASE: argus_core
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "argusadmin", "-p", "arguspass123", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============== CACHE / BROKER ==============
  redis:
    image: redis:7-alpine
    container_name: argus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============== OBJECT STORAGE ==============
  minio:
    image: minio/minio:latest
    container_name: argus-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: argusadmin
      MINIO_ROOT_PASSWORD: arguspass123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============== MONITORING (optional) ==============
  prometheus:
    image: prom/prometheus:latest
    container_name: argus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: argus-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # 3001 to avoid conflict with Next.js frontend on 3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles: ["monitoring"]
    depends_on:
      - prometheus

volumes:
  mongo_data:
  minio_data:
  prometheus_data:
  grafana_data:
